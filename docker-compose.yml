services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: logtru
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: logtru
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: ./app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://logtru:${DB_PASSWORD}@db:5432/logtru
    depends_on: [db]
  robot:
    build: ./robot
    env_file: .env
    volumes: [robotstate:/state]
    profiles: ["robot"]          # not started by default: docker compose run --rm robot
  scheduler:
    build: ./robot
    command: ["python3", "schedule.py"]
    env_file: .env
    restart: unless-stopped
    volumes: [robotstate:/state]
    depends_on: [app]
  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes: ["./backups:/backups"]
    depends_on: [db]
    entrypoint: ["/bin/sh", "-c"]
    # a compressed dump every 24 h (the first one right away); dumps older than 14 days are deleted
    command: ['while true; do pg_dump -h db -U logtru logtru | gzip > /backups/logtru-$$(date +%F).sql.gz.tmp && mv /backups/logtru-$$(date +%F).sql.gz.tmp /backups/logtru-$$(date +%F).sql.gz; find /backups -name "logtru-*.sql.gz" -mtime +14 -delete; sleep 86400; done']
  caddy:
    image: caddy:2
    env_file: .env
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on: [app]
volumes:
  robotstate:
  pgdata:
  caddy_data:
